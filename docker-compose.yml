services:
  zerka-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zerka-service
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - zerka_storage:/var/www/storage
      - zerka_cache:/var/www/bootstrap/cache
      - zerka_vendor:/var/www/vendor

    depends_on:
      - zerka-mysql

  zerka-web:
    image: nginx:alpine
    container_name: zerka-web
    restart: unless-stopped
    ports:
      - "8002:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - zerka_storage:/var/www/storage
    depends_on:
      - zerka-service

  zerka-mysql:
    image: mysql:8.0
    container_name: zerka-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: zerka_service
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    ports:
      - "3308:3306"


volumes:
  mysql_data:
  zerka_vendor:
  zerka_storage:
  zerka_cache: